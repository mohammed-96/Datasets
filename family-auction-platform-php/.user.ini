; Raise PHP's upload limits so full-size phone photos can be uploaded.
; Honored automatically by the PHP-FPM/CGI setup used on most cPanel hosts.
; If images still report "too large", raise the same two values from
; cPanel -> MultiPHP INI Editor for your domain.
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
